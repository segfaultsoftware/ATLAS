name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - prod
      - staging

permissions:
  contents: read

jobs:
  deploy_production:
    if: github.ref == 'refs/tags/prod'
    permissions:
      contents: read
    runs-on:
      group: atlas-deployment
      labels:
        - self-hosted
        - atlas-deployment
    timeout-minutes: 30
    concurrency:
      group: atlas-deployment-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          bundler-cache: true

      - name: Run deployment automation
        env:
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_REF_DELETED: ${{ github.event.deleted }}
          ATLAS_PRODUCTION_ROOT: /srv/apps/ATLAS
          ATLAS_STAGING_ROOT: /srv/apps/ATLAS-staging
          ATLAS_DEPLOYMENT_TOKEN: ${{ github.token }}
        run: bin/deployment-automation

  deploy_staging_from_main:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    environment: staging-tag-automation
    runs-on:
      group: atlas-deployment
      labels:
        - self-hosted
        - atlas-deployment
    timeout-minutes: 30
    concurrency:
      group: atlas-deployment-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          bundler-cache: true

      - name: Create staging tag GitHub App token
        id: staging_tag_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.STAGING_TAG_APP_CLIENT_ID }}
          private-key: ${{ secrets.STAGING_TAG_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Run deployment automation
        env:
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_REF_DELETED: ${{ github.event.deleted }}
          ATLAS_PRODUCTION_ROOT: /srv/apps/ATLAS
          ATLAS_STAGING_ROOT: /srv/apps/ATLAS-staging
          ATLAS_DEPLOYMENT_TOKEN: ${{ steps.staging_tag_token.outputs.token }}
        run: bin/deployment-automation

  deploy_staging_from_tag:
    if: github.ref == 'refs/tags/staging' && github.actor != 'atlas-staging-tag-automation[bot]'
    permissions:
      contents: read
    runs-on:
      group: atlas-deployment
      labels:
        - self-hosted
        - atlas-deployment
    timeout-minutes: 30
    concurrency:
      group: atlas-deployment-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          bundler-cache: true

      - name: Run deployment automation
        env:
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_REF_DELETED: ${{ github.event.deleted }}
          ATLAS_PRODUCTION_ROOT: /srv/apps/ATLAS
          ATLAS_STAGING_ROOT: /srv/apps/ATLAS-staging
          ATLAS_DEPLOYMENT_TOKEN: ${{ github.token }}
        run: bin/deployment-automation
